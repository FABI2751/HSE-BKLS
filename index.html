<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa de Trabajo Preventivo – Bakels Chile</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --blue: #003087;
    --blue-dark: #001f5c;
    --blue-mid: #1a4a9e;
    --blue-light: #e6edf8;
    --blue-pale: #f0f4fc;
    --orange: #e87722;
    --green: #15803d;
    --red: #dc2626;
    --amber: #d97706;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-600: #4b5563;
    --gray-800: #1f2937;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--gray-100); color: var(--gray-800); font-size: 13px; }

  /* ── TOPBAR ── */
  .topbar { background: var(--blue); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 52px; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .logo-badge { background: white; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 800; color: var(--blue); letter-spacing: 1px; }
  .topbar h1 { color: white; font-size: 14px; font-weight: 600; letter-spacing: 0.3px; }
  .topbar-right { display: flex; gap: 8px; }
  .btn { padding: 6px 14px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s; }
  .btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.5); color: white; }
  .btn-outline:hover { background: rgba(255,255,255,0.15); }
  .btn-orange { background: var(--orange); color: white; }
  .btn-orange:hover { background: #d06820; }
  .btn-white { background: white; color: var(--blue); }
  .btn-white:hover { background: var(--blue-light); }
  .btn-red { background: #dc2626; color: white; font-size: 11px; padding: 4px 10px; }
  .btn-red:hover { background: #b91c1c; }
  .btn-green { background: var(--green); color: white; font-size: 11px; padding: 4px 10px; }
  .btn-green:hover { background: #166534; }
  .btn-blue-sm { background: var(--blue); color: white; font-size: 11px; padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer; }
  .btn-blue-sm:hover { background: var(--blue-mid); }

  /* ── TABS ── */
  .tab-nav { background: var(--blue-dark); display: flex; overflow-x: auto; padding: 0 12px; gap: 2px; scrollbar-width: none; }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 10px 16px; color: rgba(255,255,255,0.55); cursor: pointer; font-size: 11.5px; font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; transition: all .15s; background: none; border-top: none; border-left: none; border-right: none; }
  .tab-btn:hover { color: rgba(255,255,255,0.85); }
  .tab-btn.active { color: white; border-bottom-color: var(--orange); }

  /* ── CONTENT ── */
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .page-pad { padding: 16px 20px; }

  /* ── SUMMARY BAR ── */
  .summary-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
  .s-card { background: white; border-radius: 8px; border: 1px solid var(--gray-200); padding: 12px 14px; }
  .s-card .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-400); margin-bottom: 4px; }
  .s-card .val { font-size: 22px; font-weight: 700; color: var(--blue); }
  .s-card .val.green { color: var(--green); }
  .s-card .val.amber { color: var(--amber); }
  .s-card .val.red { color: var(--red); }
  .s-card .sub { font-size: 10px; color: var(--gray-400); margin-top: 2px; }

  /* progress bar */
  .prog-wrap { background: var(--gray-200); border-radius: 99px; height: 6px; margin-top: 6px; overflow: hidden; }
  .prog-bar { height: 100%; border-radius: 99px; background: var(--blue); transition: width .4s; }
  .prog-bar.green { background: var(--green); }
  .prog-bar.amber { background: var(--amber); }
  .prog-bar.red { background: var(--red); }

  /* ── TABLE ── */
  .table-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .table-controls h2 { font-size: 13px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.4px; }
  .table-controls .actions { display: flex; gap: 6px; }
  .table-outer { background: white; border-radius: 8px; border: 1px solid var(--gray-200); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  thead tr th { background: var(--blue); color: white; padding: 6px 6px; text-align: center; font-size: 10px; font-weight: 600; white-space: nowrap; border-right: 1px solid rgba(255,255,255,0.15); position: sticky; top: 0; z-index: 3; }
  thead tr:nth-child(2) th { background: var(--blue-mid); }
  th.col-n { width: 32px; min-width: 32px; }
  th.col-act { min-width: 280px; max-width: 340px; text-align: left !important; }
  th.col-resp { min-width: 160px; }
  th.col-dir { min-width: 120px; }
  th.col-freq { min-width: 78px; }
  th.col-fecha { min-width: 88px; }
  th.col-pr { width: 30px; min-width: 30px; }
  th.col-tot { width: 52px; min-width: 52px; }
  th.col-pct { width: 60px; min-width: 60px; }
  th.col-obs { min-width: 170px; }

  /* section row */
  tr.section-row td { background: var(--blue-light); color: var(--blue); font-weight: 700; font-size: 11px; padding: 7px 10px; border-bottom: 1.5px solid var(--blue-mid); text-transform: uppercase; letter-spacing: 0.4px; }

  /* data rows */
  tbody tr.data-row td { padding: 9px 8px; border-bottom: 1px solid var(--gray-200); border-right: 1px solid #f0f0f0; vertical-align: middle; }
  tbody tr.data-row:hover td { background: var(--blue-pale); }
  tbody tr.data-row:nth-child(even) td { background: var(--gray-50); }
  tbody tr.data-row:nth-child(even):hover td { background: var(--blue-pale); }

  td.td-n { text-align: center; font-weight: 600; color: var(--blue); font-size: 11px; }
  td.td-act { font-size: 12.5px; white-space: normal; line-height: 1.45; }
  td.td-center { text-align: center; font-size: 11.5px; color: var(--gray-600); }
  td.td-freq { text-align: center; font-size: 11px; background: var(--blue-pale); color: var(--blue); }
  td.td-p { text-align: center; background: #eef3fc; color: var(--blue); font-weight: 600; font-size: 11px; }
  td.td-p.empty { background: #fafafa; color: var(--gray-400); }
  td.td-r { text-align: center; }
  td.td-total-plan { text-align: center; background: var(--blue-light); font-weight: 700; color: var(--blue); font-size: 11px; }
  td.td-total-real { text-align: center; font-weight: 700; font-size: 11px; }
  td.td-pct { text-align: center; font-weight: 700; font-size: 11px; }
  td.td-pct.pct-0 { color: var(--red); }
  td.td-pct.pct-low { color: var(--amber); }
  td.td-pct.pct-ok { color: var(--green); }
  td.td-obs { font-size: 11.5px; color: var(--gray-600); }
  td.td-del { text-align: center; }

  /* Pendientes */
  .pend-area { display:inline-block; background: var(--blue-light); color: var(--blue); font-weight:600; font-size:11px; padding:2px 8px; border-radius:4px; }
  .pend-meses { display:flex; flex-wrap:wrap; gap:4px; }
  .pend-chip { display:inline-block; background:#fdebd8; color:var(--orange); font-weight:600; font-size:10.5px; padding:2px 7px; border-radius:4px; white-space:nowrap; }

  /* inline edit */
  .edit-input { width: 100%; border: none; background: transparent; font-size: 12.5px; line-height: 1.45; color: var(--gray-800); font-family: inherit; padding: 4px 5px; }
  .edit-input:focus { outline: 1.5px solid var(--blue); border-radius: 3px; background: white; }
  .edit-obs { width: 100%; min-width: 120px; }

  /* checkbox */
  input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--blue); cursor: pointer; }

  /* ── DASHBOARD ── */
  .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .dash-title { font-size: 18px; font-weight: 700; color: var(--blue); }
  .dash-filters { display: flex; gap: 10px; align-items: center; }
  .dash-select { padding: 6px 12px; border: 1.5px solid var(--gray-200); border-radius: 6px; font-size: 12px; color: var(--gray-800); background: white; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .dash-card { background: white; border-radius: 10px; border: 1px solid var(--gray-200); padding: 16px; }
  .dash-card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-400); margin-bottom: 12px; }
  .dash-card.full { grid-column: 1 / -1; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: white; border-radius: 10px; border: 1px solid var(--gray-200); padding: 14px 16px; }
  .kpi .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-400); }
  .kpi .val { font-size: 28px; font-weight: 800; color: var(--blue); margin: 4px 0 2px; }
  .kpi .val.green { color: var(--green); }
  .kpi .val.amber { color: var(--amber); }
  .kpi .val.red { color: var(--red); }
  .kpi .sub { font-size: 10px; color: var(--gray-400); }
  .chart-wrap { position: relative; height: 220px; }
  .tab-perf-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .tab-perf-table th { background: var(--gray-100); padding: 6px 10px; text-align: left; font-weight: 600; color: var(--gray-600); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
  .tab-perf-table td { padding: 7px 10px; border-bottom: 1px solid var(--gray-200); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; }
  .badge-green { background: #dcfce7; color: #15803d; }
  .badge-amber { background: #fef9c3; color: #a16207; }
  .badge-red { background: #fee2e2; color: #b91c1c; }
  .mini-bar-wrap { background: var(--gray-200); border-radius: 99px; height: 8px; flex: 1; overflow: hidden; }
  .mini-bar { height: 100%; border-radius: 99px; background: var(--blue); }
  .mini-bar.green { background: var(--green); }
  .mini-bar.amber { background: var(--amber); }
  .mini-bar.red { background: var(--red); }

  /* ── INFORME ── */
  #informe-content { display: none; padding: 24px 32px 48px; background: var(--gray-100); }
  #informe-content.show { display: block; }
  .informe-toolbar { display: flex; justify-content: space-between; align-items: center; max-width: 860px; margin: 0 auto 12px; gap: 12px; flex-wrap: wrap; }
  .informe-title-bar { font-size: 14px; font-weight: 700; color: var(--blue); }
  .informe-toolbar-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .informe-body { background: white; border-radius: 10px; border: 1px solid var(--gray-200); padding: 32px; max-width: 860px; margin: 0 auto; }

  /* === FIRMAS === */
  .firma-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 16px; }
  .firma-box { padding: 16px 14px 22px; border: 1px solid var(--gray-200); border-radius: 8px; background: #fafbfc; }
  .firma-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .firma-lbl { font-size: 10.5px; font-weight: 600; color: var(--gray-700); min-width: 52px; }
  .firma-input { flex: 1; border: none; border-bottom: 1px solid var(--gray-300); background: transparent; padding: 4px 2px; font-size: 11px; font-family: inherit; outline: none; }
  .firma-input:focus { border-bottom-color: var(--blue); }
  .firma-line { border-top: 1px solid var(--gray-700); margin: 40px 12px 6px; }
  .firma-cap { text-align: center; font-size: 10px; color: var(--gray-600); letter-spacing: 0.5px; text-transform: uppercase; }
  .informe-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--gray-200); }

  @media print {
    body { background: white !important; }
    /* Ocultar TODO el body */
    body > * { display: none !important; }
    /* Mostrar SOLO el informe y dejarlo a página completa */
    body > #informe-content.show { display: block !important; padding: 0 !important; background: white !important; }
    /* Dentro del informe, ocultar toolbar y acciones */
    .informe-toolbar, .informe-actions, #save-indicator { display: none !important; }
    .informe-body { box-shadow: none !important; border: none !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    .firma-input { border-bottom: 1px solid #374151 !important; background: transparent !important; }
    @page { margin: 18mm 15mm; }
  }
  .informe-logo { background: var(--blue); color: white; padding: 20px 24px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .informe-logo h2 { font-size: 18px; font-weight: 700; }
  .informe-logo p { font-size: 11px; opacity: 0.75; margin-top: 3px; }
  .informe-section { margin: 20px 0 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--blue); border-bottom: 2px solid var(--blue-light); padding-bottom: 4px; letter-spacing: 0.5px; }
  .informe-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .informe-kpi { border: 1px solid var(--gray-200); border-radius: 6px; padding: 10px 12px; text-align: center; }
  .informe-kpi .lbl { font-size: 9px; text-transform: uppercase; color: var(--gray-400); }
  .informe-kpi .val { font-size: 22px; font-weight: 800; color: var(--blue); }
  .informe-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 16px; }
  .informe-table th { background: var(--blue); color: white; padding: 6px 10px; text-align: left; font-size: 10px; }
  .informe-table td { padding: 6px 10px; border-bottom: 1px solid var(--gray-200); }
  .informe-table tr:nth-child(even) td { background: var(--gray-50); }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 10px; padding: 24px; width: 480px; max-width: 95vw; }
  .modal h3 { font-size: 15px; font-weight: 700; color: var(--blue); margin-bottom: 16px; }
  .modal label { display: block; font-size: 11px; font-weight: 600; color: var(--gray-600); margin-bottom: 3px; margin-top: 10px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 7px 10px; border: 1.5px solid var(--gray-200); border-radius: 6px; font-size: 12px; font-family: inherit; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--blue); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo-badge">BAKELS</div>
    <h1>Programa de Trabajo Preventivo</h1>
  </div>
  <div class="topbar-right">
    <span id="save-indicator" style="font-size:11px;color:#15803d;opacity:0.55;transition:opacity .25s;font-weight:500;white-space:nowrap">Sin cambios</span>
    <button class="btn btn-outline" onclick="exportJSON()">⬇ Exportar JSON</button>
    <button class="btn btn-outline" onclick="exportCSV()">⬇ Exportar CSV</button>
    <label class="btn btn-outline" style="cursor:pointer">⬆ Importar <input type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label>
    <button class="btn btn-outline" onclick="clearLS()" style="color:#b91c1c;border-color:#fecaca" title="Borra todos los datos guardados">🗑 Limpiar</button>
    <button class="btn btn-orange" onclick="generarInforme()">📄 Informe Gerencial</button>
  </div>
</div>

<!-- TAB NAV -->
<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab(0)">0 · Dashboard</button>
  <button class="tab-btn" onclick="switchTab(1)">1 · Política SST</button>
  <button class="tab-btn" onclick="switchTab(2)">2 · Identificación y Control de Riesgos</button>
  <button class="tab-btn" onclick="switchTab(3)">3 · Medidas de Control</button>
  <button class="tab-btn" onclick="switchTab(4)">4 · Hábitos Saludables</button>
  <button class="tab-btn" onclick="switchTab(5)">5 · Prevención Conducción</button>
  <button class="tab-btn" onclick="switchTab(6)">6 · Capacitación</button>
  <button class="tab-btn" onclick="switchTab(7)">7 · Medición y Monitoreo</button>
  <button class="tab-btn" onclick="switchTab(8)" style="color:#ffd9b3">⚠ Pendientes</button>
</div>

<!-- ════════════════════════ TAB 0: DASHBOARD ════════════════════════ -->
<div class="tab-content active page-pad" id="tab-0">
  <div class="dash-header">
    <div class="dash-title">Dashboard Gerencial · Bakels Chile</div>
    <div class="dash-filters">
      <select class="dash-select" id="dash-mode" onchange="renderDashboard()">
        <option value="anual">Vista Anual (Global)</option>
        <option value="mes">Vista por Mes</option>
      </select>
      <select class="dash-select" id="dash-mes" style="display:none" onchange="renderDashboard()">
        <option value="0">Jun 25</option><option value="1">Jul 25</option>
        <option value="2">Ago 25</option><option value="3">Sep 25</option>
        <option value="4">Oct 25</option><option value="5">Nov 25</option>
        <option value="6">Dic 25</option><option value="7">Ene 26</option>
        <option value="8">Feb 26</option><option value="9">Mar 26</option>
        <option value="10">Abr 26</option><option value="11">May 26</option>
        <option value="12">Jun 26</option><option value="13">Jul 26</option>
        <option value="14">Ago 26</option>
      </select>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid" id="dash-kpis"></div>

  <div class="dash-grid">
    <div class="dash-card">
      <h3>% Cumplimiento por Área</h3>
      <div class="chart-wrap"><canvas id="chart-areas"></canvas></div>
    </div>
    <div class="dash-card">
      <h3>Avance mensual (Planificado vs Realizado)</h3>
      <div class="chart-wrap"><canvas id="chart-mensual"></canvas></div>
    </div>
    <div class="dash-card full">
      <h3>Resumen por Pestaña</h3>
      <table class="tab-perf-table" id="dash-tab-table"></table>
    </div>
  </div>
</div>

<!-- ════════════════════════ INFORME GERENCIAL (root level para impresión limpia) ════════════════════════ -->
<div id="informe-content">
  <div class="informe-toolbar">
    <span class="informe-title-bar">Informe Gerencial</span>
    <div class="informe-toolbar-controls">
      <label style="font-size:11px;color:var(--gray-700);font-weight:600">Período:</label>
      <select id="informe-periodo" class="dash-select" onchange="generarInforme()">
        <option value="global">Global (Jun 25 – Ago 26)</option>
        <option value="0">Junio 2025</option>
        <option value="1">Julio 2025</option>
        <option value="2">Agosto 2025</option>
        <option value="3">Septiembre 2025</option>
        <option value="4">Octubre 2025</option>
        <option value="5">Noviembre 2025</option>
        <option value="6">Diciembre 2025</option>
        <option value="7">Enero 2026</option>
        <option value="8">Febrero 2026</option>
        <option value="9">Marzo 2026</option>
        <option value="10">Abril 2026</option>
        <option value="11">Mayo 2026</option>
        <option value="12">Junio 2026</option>
        <option value="13">Julio 2026</option>
        <option value="14">Agosto 2026</option>
      </select>
      <button class="btn btn-outline" style="color:var(--blue);border-color:var(--blue)" onclick="window.print()">🖨 Imprimir / PDF</button>
      <button class="btn btn-red" onclick="document.getElementById('informe-content').classList.remove('show')">✕ Cerrar</button>
    </div>
  </div>
  <div class="informe-body" id="informe-body"></div>
</div>

<!-- ════════════════════════ TABS 1–7 ════════════════════════ -->
<div class="tab-content page-pad" id="tab-1"></div>
<div class="tab-content page-pad" id="tab-2"></div>
<div class="tab-content page-pad" id="tab-3"></div>
<div class="tab-content page-pad" id="tab-4"></div>
<div class="tab-content page-pad" id="tab-5"></div>
<div class="tab-content page-pad" id="tab-6"></div>
<div class="tab-content page-pad" id="tab-7"></div>
<div class="tab-content page-pad" id="tab-8"></div>

<!-- MODAL AGREGAR ACTIVIDAD -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <h3>Agregar Actividad</h3>
    <label>Actividad</label>
    <input type="text" id="m-act" placeholder="Nombre de la actividad">
    <label>Responsable</label>
    <input type="text" id="m-resp">
    <label>Dirigido a</label>
    <input type="text" id="m-dir">
    <label>Frecuencia</label>
    <select id="m-freq">
      <option>Cada Vez</option><option>Mensual</option><option>Trimestral</option>
      <option>Semestral</option><option>Anual</option><option>Semanal</option>
    </select>
    <label>Fecha Implementación</label>
    <input type="text" id="m-fecha" placeholder="ej: 01-09-2025">
    <label>Meses Planificados (marcar)</label>
    <div id="m-meses" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function calcRow(row) {
  const totalPlan = row.p.reduce((a,b)=>a+b, 0);
  const totalReal = row.r.filter((v,i)=> v && row.p[i] > 0).length;
  const pct = totalPlan === 0 ? null : Math.round((totalReal / totalPlan) * 100);
  return { totalPlan, totalReal, pct };
}

function calcTab(tabId) {
  const rows = DATA[tabId].rows;
  let plan = 0, real = 0;
  rows.forEach(r => {
    const c = calcRow(r);
    plan += c.totalPlan;
    real += c.totalReal;
  });
  const pct = plan === 0 ? null : Math.round((real/plan)*100);
  return { plan, real, pct, count: rows.length };
}

function calcGlobal() {
  let plan=0, real=0, count=0;
  for(let t=1;t<=7;t++) {
    const c = calcTab(t);
    plan += c.plan; real += c.real; count += c.count;
  }
  const pct = plan===0 ? null : Math.round((real/plan)*100);
  return { plan, real, pct, count };
}

function calcMes(mesIdx) {
  let plan=0, real=0;
  for(let t=1;t<=7;t++) {
    DATA[t].rows.forEach(row => {
      plan += row.p[mesIdx] || 0;
      if(row.r[mesIdx] && row.p[mesIdx] > 0) real += 1;
    });
  }
  const pct = plan===0 ? null : Math.round((real/plan)*100);
  return { plan, real, pct };
}

function pctClass(pct) {
  if(pct === null) return '';
  if(pct === 0) return 'pct-0';
  if(pct < 70) return 'pct-low';
  return 'pct-ok';
}

function badgeClass(pct) {
  if(pct === null || pct === 0) return 'badge-red';
  if(pct < 70) return 'badge-amber';
  return 'badge-green';
}

function barClass(pct) {
  if(pct === null || pct < 40) return 'red';
  if(pct < 70) return 'amber';
  return 'green';
}

function renderRow(tabId, ri, row) {
  const {totalPlan, totalReal, pct} = calcRow(row);
  const pc = pctClass(pct);

  const months = MESES.map((m,mi) => {
    const hasP = row.p[mi] > 0;
    return `
      <td class="td-p ${hasP?'':'empty'}"><input type="checkbox" ${hasP?'checked':''} title="Planificado ${MESES[mi]}" onchange="toggleP(${tabId},${ri},${mi},this.checked)" style="accent-color:#1a4a9e"></td>

    <td class="td-center"><input class="edit-input" value="${escHtml(row.resp)}" onchange="editField(${tabId},${ri},'resp',this.value)"></td>

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ═══════════════════════════════════════════════════════════
// PERSISTENCIA LOCALSTORAGE
// ═══════════════════════════════════════════════════════════
const LS_KEY = 'bakels_programa_preventivo_v1';
let saveTimer = null;

function saveLS() {
  // debounce 400 ms para no escribir en cada tecla
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(DATA));
      flashSaved();
    } catch(e) {
      console.error('Error guardando en localStorage:', e);
    }
  }, 400);
}

function loadLS() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object' && parsed[1] && parsed[1].rows) {
      DATA = parsed;
      return true;
    }
  } catch(e) {
    console.error('Error cargando localStorage:', e);
  }
  return false;
}

function clearLS() {
  if(!confirm('¿Borrar todos los datos guardados y volver al estado inicial? Esta acción no se puede deshacer.')) return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}

function flashSaved() {
  const ind = document.getElementById('save-indicator');
  if(!ind) return;
  ind.textContent = '✓ Guardado ' + new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  ind.style.opacity = '1';
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>{ ind.style.opacity = '0.55'; }, 1500);
}

// ═══════════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════════
function toggleP(tabId, ri, mi, val) {
  DATA[tabId].rows[ri].p[mi] = val ? 1 : 0;
  const tr = document.getElementById(`row-${tabId}-${ri}`);
  if(tr) {
    const checks = tr.querySelectorAll('input[type=checkbox]');
    const pCell = checks[mi*2].closest('td');
    if(pCell) pCell.className = val ? 'td-p' : 'td-p empty';
  }
  updateRow(tabId, ri);
  updateTabSummary(tabId);
  saveLS();
}

function toggleR(tabId, ri, mi, val) {
  DATA[tabId].rows[ri].r[mi] = val;
  updateRow(tabId, ri);
  updateTabSummary(tabId);
  saveLS();
}

function editField(tabId, ri, field, val) {
  DATA[tabId].rows[ri][field] = val;
  saveLS();
}

function updateRow(tabId, ri) {
  const row = DATA[tabId].rows[ri];
  const {totalPlan, totalReal, pct} = calcRow(row);
  const tr = document.getElementById(`row-${tabId}-${ri}`);
  if(!tr) return;
  const cells = tr.querySelectorAll('td');
  // find total cols (after 6 fixed + 30 month cols = 36 offset)
  const base = 6 + 30;
  cells[base].textContent = totalPlan;
  cells[base+1].textContent = totalReal;
  const pctCell = cells[base+2];
  pctCell.textContent = pct === null ? 'N/A' : `${pct}%`;
  pctCell.className = `td-pct ${pctClass(pct)}`;
}

function updateTabSummary(tabId) {
  const c = calcTab(tabId);
  const pct = c.pct ?? 0;
  const pc = pct >= 70 ? 'green' : pct > 0 ? 'amber' : '';
  const bc = barClass(pct);
  const tab = document.getElementById(`tab-${tabId}`);
  if(!tab) return;
  const vals = tab.querySelectorAll('.s-card .val');
  if(vals.length >= 4) {
    vals[1].textContent = c.plan;
    vals[2].textContent = c.real;
    vals[2].className = `val ${pc}`;
    vals[3].textContent = `${c.pct ?? 'N/A'}%`;
    vals[3].className = `val ${pc}`;
    const bar = tab.querySelector('.prog-bar');
    if(bar) { bar.style.width = `${pct}%`; bar.className = `prog-bar ${bc}`; }
  }
}

function deleteRow(tabId, ri) {
  if(!confirm('¿Eliminar esta actividad?')) return;
  DATA[tabId].rows.splice(ri, 1);
  DATA[tabId].rows.forEach((r,i) => r.n = i+1);
  renderTab(tabId);
  saveLS();
}

function openModal(tabId) {

  document.getElementById('m-dir').value = '';
  document.getElementById('m-fecha').value = '';
  document.getElementById('modal-add').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-add').classList.remove('open');
}

function confirmAdd() {
  const act = document.getElementById('m-act').value.trim();
  if(!act) { alert('Ingresa el nombre de la actividad'); return; }
  const p = Array(15).fill(0);
  document.querySelectorAll('#m-meses input[type=checkbox]').forEach(cb => {
    if(cb.checked) p[parseInt(cb.dataset.mi)] = 1;
  });
  const rows = DATA[currentAddTab].rows;
  rows.push({
    n: rows.length + 1,
    act,
    resp: document.getElementById('m-resp').value,
    dir: document.getElementById('m-dir').value,
    freq: document.getElementById('m-freq').value,
    fecha: document.getElementById('m-fecha').value,
    p, r: Array(15).fill(false), obs: ''
  });
  closeModal();
  renderTab(currentAddTab);
  saveLS();
}

  });

  // Chart: mensual
  if(chartMensual) chartMensual.destroy();
  const mesP = MESES.map((_,mi) => {
    let s=0; for(let t=1;t<=7;t++) DATA[t].rows.forEach(r=>s+=r.p[mi]||0); return s;
  });
  const mesR = MESES.map((_,mi) => {
    let s=0; for(let t=1;t<=7;t++) DATA[t].rows.forEach(r=>{ if(r.r[mi]&&r.p[mi]>0)s++; }); return s;
  });

  chartMensual = new Chart(document.getElementById('chart-mensual'), {
    type: 'line',
    data: {
      labels: MESES,
      datasets: [
        { label:'Planificado', data:mesP, borderColor:'#b5c9e8', backgroundColor:'rgba(181,201,232,0.15)', tension:.3 },
        { label:'Realizado', data:mesR, borderColor:'#003087', backgroundColor:'rgba(0,48,135,0.1)', tension:.3, fill:true }
      ]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{size:10}}}}, scales:{x:{ticks:{font:{size:9},maxRotation:45}},y:{ticks:{font:{size:10}}}} }
  });

  // Tab performance table
  const tt = document.getElementById('dash-tab-table');
  tt.innerHTML = `<thead><tr><th>Área / Pestaña</th><th>Actividades</th><th>Plan</th><th>Realizado</th><th>Avance</th><th>Estado</th></tr></thead>
  <tbody>${[1,2,3,4,5,6,7].map(t=>{
    const c = calcTab(t);
    const pct = c.pct ?? 0;
    const bc = barClass(pct);
    return `<tr>
      <td style="font-weight:600;color:var(--blue)">${TAB_NAMES[t]}</td>
      <td style="text-align:center">${c.count}</td>
      <td style="text-align:center">${c.plan}</td>
      <td style="text-align:center">${c.real}</td>
      <td style="min-width:120px"><div style="display:flex;align-items:center;gap:8px">
        <div class="mini-bar-wrap"><div class="mini-bar ${bc}" style="width:${pct}%"></div></div>
        <span style="font-size:11px;font-weight:700;color:var(--gray-600);min-width:35px">${pct}%</span>
      </div></td>
      <td><span class="badge ${badgeClass(c.pct)}">${pct===100?'Completo':pct>=70?'En curso':pct>0?'Parcial':'Pendiente'}</span></td>
    </tr>`;
  }).join('')}</tbody>`;
}

// ═══════════════════════════════════════════════════════════
// INFORME GERENCIAL
// ═══════════════════════════════════════════════════════════
// Cálculos filtrados por mes específico (mi = índice 0..14) o global (mi=null)
function calcRowMes(row, mi) {
  if(mi === null) return calcRow(row);
  const plan = row.p[mi] || 0;
  const real = (plan > 0 && row.r[mi]) ? 1 : 0;
  const pct = plan === 0 ? null : Math.round((real/plan)*100);
  return { totalPlan: plan, totalReal: real, pct };
}
function calcTabMes(tabId, mi) {
  if(mi === null) return calcTab(tabId);
  const rows = DATA[tabId].rows;
  let plan = 0, real = 0, activas = 0;
  rows.forEach(r => {
    const c = calcRowMes(r, mi);
    plan += c.totalPlan;
    real += c.totalReal;
    if(c.totalPlan > 0) activas++;
  });
  const pct = plan === 0 ? null : Math.round((real/plan)*100);
  return { plan, real, pct, count: activas };
}
function calcGlobalMes(mi) {
  if(mi === null) return calcGlobal();
  let plan=0, real=0, count=0;
  for(let t=1;t<=7;t++) {
    const c = calcTabMes(t, mi);
    plan += c.plan; real += c.real; count += c.count;
  }
  const pct = plan === 0 ? null : Math.round((real/plan)*100);
  return { plan, real, pct, count };
}

      </div>
      <p style="font-size:12px;color:var(--gray-600);line-height:1.7;margin-bottom:16px">${resumenTxt}</p>

// IMPORT / EXPORT
// ═══════════════════════════════════════════════════════════
function exportJSON() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `programa_preventivo_bakels_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function exportCSV() {
  let rows = ['Pestaña,N°,Actividad,Responsable,Dirigido a,Frecuencia,Fecha Impl.,Total Plan,Total Realizado,% Cumplimiento,Observaciones'];
  for(let t=1;t<=7;t++) {
    DATA[t].rows.forEach(row => {
      const c = calcRow(row);
      rows.push([TAB_NAMES[t], row.n, `"${row.act}"`, `"${row.resp}"`, `"${row.dir}"`, row.freq, row.fecha, c.totalPlan, c.totalReal, c.pct??'N/A', `"${row.obs}"`].join(','));
    });
  }
  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `programa_preventivo_bakels_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function importJSON(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      DATA = imported;
      renderAll();
      saveLS();
      alert('Datos importados correctamente.');
    } catch { alert('Error al leer el archivo JSON.'); }
  };
  reader.readAsText(file);
}
